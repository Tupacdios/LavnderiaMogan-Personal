<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavandería Mogán - Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col justify-between">
    
    <!-- PANTALLA 1: LOGIN -->
    <div id="pantalla-login" class="p-6 flex flex-col justify-center flex-grow">
      
      <div class="text-center mb-6">
        <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
          Portal Actualizado v2.0
        </span>
      </div>

      <!-- LOGO DIBUJADO EN CÓDIGO (NO NECESITA FOTO EXTERNA) -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center space-x-3 mb-2 p-3 bg-sky-50 rounded-2xl border border-sky-100">
          <div class="w-12 h-12 bg-[#009ee3] text-white rounded-xl flex items-center justify-center text-2xl shadow-sm">
            <i class="fa-solid fa-droplet"></i>
          </div>
          <div class="text-left leading-none text-[#009ee3]" style="font-family: Georgia, serif;">
            <div class="text-xl font-normal">Lavandería</div>
            <div class="text-3xl font-bold">Mogán</div>
          </div>
        </div>
        <p class="text-xs font-medium text-slate-400 mt-2">Acceso exclusivo para personal</p>
      </div>

      <form id="form-login" class="space-y-4" onsubmit="iniciarSesion(event)">
        <div id="error-login" class="hidden bg-red-50 text-red-600 text-xs font-semibold p-3 rounded-xl border border-red-200 text-center">
          Usuario o contraseña incorrectos
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Usuario</label>
          <input type="text" id="usuario" placeholder="Escribe: admin, adai o dolly" required 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#009ee3] focus:outline-none text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
          <input type="password" id="password" placeholder="••••" required 
                 class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-[#009ee3] focus:outline-none text-sm">
        </div>

        <button type="submit" class="w-full bg-[#009ee3] hover:bg-[#0086c2] text-white font-semibold py-3.5 rounded-xl shadow-md transition">
          Entrar
        </button>
      </form>

      <!-- Acceso rápido para ti al panel de Administrador -->
      <div class="mt-8 pt-4 border-t border-slate-100 text-center">
        <button onclick="abrirAdminDirecto()" class="text-xs text-slate-500 hover:text-[#009ee3] font-semibold underline">
          <i class="fa-solid fa-gear mr-1"></i> Entrar como Administrador (Subir horarios y nóminas)
        </button>
      </div>
    </div>

    <!-- PANTALLA 2: VISTA DE EMPLEADO -->
    <div id="pantalla-empleado" class="hidden flex flex-col flex-grow">
      <header class="bg-white border-b border-slate-200 p-4 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center space-x-2">
            <div class="w-7 h-7 bg-[#009ee3] text-white rounded-lg flex items-center justify-center text-xs">
              <i class="fa-solid fa-droplet"></i>
            </div>
            <div class="leading-none text-[#009ee3]" style="font-family: Georgia, serif;">
              <span class="text-sm font-normal">Lavandería</span>
              <span class="text-base font-bold">Mogán</span>
            </div>
          </div>
          <button onclick="cerrarSesion()" class="text-xs bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 font-medium">
            Salir
          </button>
        </div>
        <div class="bg-sky-50 rounded-xl p-3 flex items-center justify-between border border-sky-100">
          <div>
            <p class="text-xs text-sky-600 font-medium">Empleado/a</p>
            <h2 id="nombre-empleado-vista" class="text-base font-bold text-slate-800 capitalize">Nombre</h2>
          </div>
          <span class="text-xs bg-white text-sky-700 font-semibold px-2.5 py-1 rounded-md border border-sky-200">Activo</span>
        </div>
      </header>

      <div class="flex border-b border-slate-200 bg-white px-4">
        <button onclick="cambiarPestana('horarios')" id="tab-btn-horarios" class="flex-1 py-3 font-semibold text-sm border-b-2 border-[#009ee3] text-[#009ee3]">
          Horario semanal
        </button>
        <button onclick="cambiarPestana('nominas')" id="tab-btn-nominas" class="flex-1 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-400">
          Mis Nóminas
        </button>
      </div>

      <main id="seccion-horarios" class="p-4 flex-grow space-y-2">
        <div id="contenedor-horarios-empleado" class="space-y-2"></div>
      </main>

      <main id="seccion-nominas" class="hidden p-4 flex-grow space-y-3">
        <div id="contenedor-nominas-empleado" class="space-y-2"></div>
      </main>
    </div>

    <!-- PANTALLA 3: PANEL DE ADMINISTRADOR -->
    <div id="pantalla-admin" class="hidden flex flex-col flex-grow bg-slate-50">
      <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <div>
          <span class="text-[10px] uppercase bg-[#009ee3] text-white px-2 py-0.5 rounded font-bold">Administrador</span>
          <h2 class="text-base font-bold mt-1">Panel Lavandería Mogán</h2>
        </div>
        <button onclick="cerrarSesion()" class="text-xs bg-slate-800 px-3 py-2 rounded-lg text-slate-200">
          Salir
        </button>
      </header>

      <main class="p-4 space-y-4 flex-grow overflow-y-auto">
        <!-- 1. Seleccionar o Crear Empleado -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <label class="block text-xs font-bold text-slate-700 uppercase mb-2">1. Elegir Empleado</label>
          <select id="admin-select-empleado" onchange="cargarDatosEmpleadoAdmin()" class="w-full p-3 border border-slate-300 rounded-xl text-sm font-bold bg-slate-50">
          </select>

          <div class="mt-3 pt-3 border-t border-slate-100">
            <p class="text-xs font-bold text-slate-600 mb-2">Crear nuevo empleado:</p>
            <div class="flex gap-2">
              <input type="text" id="nuevo-emp-user" placeholder="Nombre usuario" class="flex-1 p-2 border rounded-lg text-xs">
              <input type="text" id="nuevo-emp-pass" placeholder="Contraseña" class="w-24 p-2 border rounded-lg text-xs">
              <button onclick="crearEmpleado()" class="bg-[#009ee3] text-white px-3 py-2 rounded-lg text-xs font-bold">Añadir</button>
            </div>
          </div>
        </div>

        <!-- 2. Editar Horario -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <h3 class="text-xs font-bold text-slate-700 uppercase mb-3">2. Editar Hora de Inicio / Día Libre</h3>
          <div id="admin-lista-dias" class="space-y-2"></div>
          <button onclick="guardarHorarioAdmin()" class="mt-4 w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm shadow">
            Guardar Horario de la Semana
          </button>
        </div>

        <!-- 3. Subir Nómina -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <h3 class="text-xs font-bold text-slate-700 uppercase mb-3">3. Subir Nómina (PDF)</h3>
          <div class="space-y-2">
            <input type="text" id="admin-mes-nomina" placeholder="Mes (Ej: Octubre 2026)" class="w-full p-2.5 border rounded-xl text-sm">
            <input type="url" id="admin-url-nomina" placeholder="Enlace del PDF" class="w-full p-2.5 border rounded-xl text-sm">
            <button onclick="agregarNominaAdmin()" class="w-full bg-[#009ee3] text-white font-bold py-2.5 rounded-xl text-sm">
              + Añadir Nómina
            </button>
          </div>
          <div id="admin-lista-nominas" class="mt-3 space-y-1.5"></div>
        </div>
      </main>
    </div>

  </div>

  <script>
    const diasSemana = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];

    const datosIniciales = {
      empleados: {
        'adai': {
          pass: '1234',
          nombre: 'Adai',
          horario: { 'Lunes': '07:00', 'Martes': '07:00', 'Miércoles': 'LIBRE', 'Jueves': '14:00', 'Viernes': '07:00', 'Sábado': '08:00', 'Domingo': 'LIBRE' },
          nominas: [{ mes: 'Septiembre 2026', url: '#' }]
        },
        'dolly': {
          pass: '1234',
          nombre: 'Dolly',
          horario: { 'Lunes': '08:00', 'Martes': 'LIBRE', 'Miércoles': '08:00', 'Jueves': '08:00', 'Viernes': '14:00', 'Sábado': 'LIBRE', 'Domingo': '09:00' },
          nominas: [{ mes: 'Septiembre 2026', url: '#' }]
        }
      }
    };

    let db = JSON.parse(localStorage.getItem('lavanderiaMoganDB')) || datosIniciales;
    function guardarDB() { localStorage.setItem('lavanderiaMoganDB', JSON.stringify(db)); }

    function abrirAdminDirecto() {
      const clave = prompt('Introduce la contraseña de administrador (escribe: mogan2026):');
      if (clave === 'mogan2026') {
        document.getElementById('pantalla-login').classList.add('hidden');
        document.getElementById('pantalla-admin').classList.remove('hidden');
        inicializarPanelAdmin();
      } else if (clave !== null) {
        alert('Contraseña incorrecta');
      }
    }

    function iniciarSesion(e) {
      e.preventDefault();
      const user = document.getElementById('usuario').value.trim().toLowerCase();
      const pass = document.getElementById('password').value.trim();

      if (user === 'admin' && pass === 'mogan2026') {
        document.getElementById('pantalla-login').classList.add('hidden');
        document.getElementById('pantalla-admin').classList.remove('hidden');
        inicializarPanelAdmin();
        return;
      }

      if (db.empleados[user] && db.empleados[user].pass === pass) {
        document.getElementById('pantalla-login').classList.add('hidden');
        document.getElementById('pantalla-empleado').classList.remove('hidden');
        mostrarDatosEmpleado(user);
        return;
      }

      document.getElementById('error-login').classList.remove('hidden');
    }

    function cerrarSesion() {
      document.getElementById('pantalla-empleado').classList.add('hidden');
      document.getElementById('pantalla-admin').classList.add('hidden');
      document.getElementById('pantalla-login').classList.remove('hidden');
      document.getElementById('form-login').reset();
    }

    function mostrarDatosEmpleado(userKey) {
      const emp = db.empleados[userKey];
      document.getElementById('nombre-empleado-vista').textContent = emp.nombre;
      const contHorarios = document.getElementById('contenedor-horarios-empleado');
      contHorarios.innerHTML = '';
      diasSemana.forEach(dia => {
        const valor = emp.horario[dia] || 'LIBRE';
        const esLibre = valor === 'LIBRE';
        contHorarios.innerHTML += `
          <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-sm">
            <span class="font-bold text-sm text-slate-800">${dia}</span>
            <span class="${esLibre ? 'bg-slate-100 text-slate-500' : 'bg-sky-50 text-[#009ee3]'} font-bold text-xs px-3 py-1.5 rounded-lg border">
              ${esLibre ? 'LIBRE' : 'Inicio: ' + valor + ' h'}
            </span>
          </div>`;
      });

      const contNominas = document.getElementById('contenedor-nominas-empleado');
      contNominas.innerHTML = '';
      emp.nominas.forEach(nom => {
        contNominas.innerHTML += `
          <div class="p-4 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-sm">
            <span class="font-bold text-sm text-slate-800">${nom.mes}</span>
            <a href="${nom.url}" target="_blank" class="text-xs bg-slate-100 text-slate-700 px-3 py-2 rounded-lg font-bold">Descargar PDF</a>
          </div>`;
      });
    }

    function inicializarPanelAdmin() {
      const select = document.getElementById('admin-select-empleado');
      select.innerHTML = '';
      Object.keys(db.empleados).forEach(key => {
        select.innerHTML += `<option value="${key}">${db.empleados[key].nombre} (usuario: ${key})</option>`;
      });
      cargarDatosEmpleadoAdmin();
    }

    function cargarDatosEmpleadoAdmin() {
      const userKey = document.getElementById('admin-select-empleado').value;
      const emp = db.empleados[userKey];
      const contDias = document.getElementById('admin-lista-dias');
      contDias.innerHTML = '';

      diasSemana.forEach(dia => {
        const val = emp.horario[dia] || '07:00';
        const esLibre = val === 'LIBRE';
        contDias.innerHTML += `
          <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border">
            <span class="text-xs font-bold text-slate-700 w-20">${dia}</span>
            <input type="time" id="hora-${dia}" value="${esLibre ? '07:00' : val}" ${esLibre ? 'disabled' : ''} class="p-1 border rounded text-xs bg-white">
            <label class="flex items-center space-x-1 text-xs font-semibold">
              <input type="checkbox" id="libre-${dia}" ${esLibre ? 'checked' : ''} onchange="document.getElementById('hora-${dia}').disabled = this.checked">
              <span>Libre</span>
            </label>
          </div>`;
      });
      mostrarNominasAdmin(userKey);
    }

    function guardarHorarioAdmin() {
      const userKey = document.getElementById('admin-select-empleado').value;
      diasSemana.forEach(dia => {
        const esLibre = document.getElementById(`libre-${dia}`).checked;
        const hora = document.getElementById(`hora-${dia}`).value;
        db.empleados[userKey].horario[dia] = esLibre ? 'LIBRE' : hora;
      });
      guardarDB();
      alert('¡Horario guardado correctamente!');
    }

    function crearEmpleado() {
      const user = document.getElementById('nuevo-emp-user').value.trim().toLowerCase();
      const pass = document.getElementById('nuevo-emp-pass').value.trim();
      if (!user || !pass) return alert('Pon nombre y contraseña');
      db.empleados[user] = {
        pass: pass,
        nombre: user.charAt(0).toUpperCase() + user.slice(1),
        horario: { 'Lunes': '07:00', 'Martes': '07:00', 'Miércoles': '07:00', 'Jueves': '07:00', 'Viernes': '07:00', 'Sábado': 'LIBRE', 'Domingo': 'LIBRE' },
        nominas: []
      };
      guardarDB();
      inicializarPanelAdmin();
      document.getElementById('admin-select-empleado').value = user;
      cargarDatosEmpleadoAdmin();
      alert('Empleado añadido');
    }

    function agregarNominaAdmin() {
      const userKey = document.getElementById('admin-select-empleado').value;
      const mes = document.getElementById('admin-mes-nomina').value.trim();
      const url = document.getElementById('admin-url-nomina').value.trim() || '#';
      if (!mes) return alert('Pon el mes');
      db.empleados[userKey].nominas.unshift({ mes, url });
      guardarDB();
      mostrarNominasAdmin(userKey);
      alert('Nómina subida');
    }

    function mostrarNominasAdmin(userKey) {
      const lista = document.getElementById('admin-lista-nominas');
      lista.innerHTML = '';
      db.empleados[userKey].nominas.forEach((n, idx) => {
        lista.innerHTML += `
          <div class="flex justify-between items-center text-xs bg-slate-50 p-2 rounded border">
            <span>${n.mes}</span>
            <button onclick="borrarNomina('${userKey}', ${idx})" class="text-red-500 font-bold">Borrar</button>
          </div>`;
      });
    }

    function borrarNomina(userKey, idx) {
      db.empleados[userKey].nominas.splice(idx, 1);
      guardarDB();
      mostrarNominasAdmin(userKey);
    }

    function cambiarPestana(pestana) {
      document.getElementById('seccion-horarios').classList.toggle('hidden', pestana !== 'horarios');
      document.getElementById('seccion-nominas').classList.toggle('hidden', pestana === 'horarios');
    }
  </script>
</body>
</html>
